#-----------------------------------------------------------------------
#   globals.properties : teamAgent
#-----------------------------------------------------------------------

# 서버 환경(local, dev, prod)
Globals.env = dev

# 운영서버 타입(WINDOWS, UNIX)
Globals.OsType = UNIX

# DB서버 타입(mysql, oracle, altibase, tibero, cubrid, maria, postgres)
Globals.DbType = mysql

# 권한 인증방식(dummy, session, security)
Globals.Auth = dummy

# MainPage Setting
Globals.MainPage = /main.do

# 서비스URL
Globals.serviceUrl = http://localhost:8082

# Database
Globals.mysql.DriverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
Globals.mysql.Url=jdbc:log4jdbc:mysql://localhost:3306/team_agent?allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&autoReconnect=true
Globals.mysql.UserName = admin
Globals.mysql.Password = DB_PASSWORD

# 로그인 인증 제한
Globals.login.Lock = true
Globals.login.LockCount = 5

# DB 설정
Globals.Master.db = team_agent
Globals.Template.db = team_agent
Globals.User.db = team_agent

Master.CompId = team_agent
Template.CompId = team_agent
User.CompId = team_agent

# 파일 업로드 경로
Globals.fileStorePath=/home/ec2-user/teamagent-data/upload/
Globals.webRootPath=/opt/tomcat-8.5.71/webapps/ROOT/

# 로그백업 경로
log.backupPath=D:/backupLogs/

Globals.hashedPassword=HASHED_PASSWORD
Globals.crypto.masterPath=
Globals.crypto.key=

# 파일 업로드 설정
fileUpload.defaultMaxSize = 52428800
fileUpload.defaultMaxCount = 5
fileUpload.allowFileExts = jpg,jpeg,gif,png,bmp,txt,pdf,xls,xlsx,ppt,pptx,doc,docx,hwp,zip

# 파일 뷰 변환 설정
fileView.libreOffice.exec=/usr/bin/soffice
fileView.tempDir=/tmp
fileView.convertTimeoutSec=120
fileView.txt.maxBytes=1048576

# 인증 설정
auth.accessCount = 5
auth.accessOtpCount = 5
auth.mainPage = redirect:/main.do
auth.otp.noAuthPage = redirect:/login.do?noOtpAuth
auth.otp.accessDeniedPage = redirect:/login.do?accessDenied
auth.otp.accessOtpFailPage = redirect:/login.do?accessOtpFail

# session timeout
globals.web.timeout = 3600000

Globals.apps=teamagent.local

# 비밀번호 초기화 전화번호
pwReset.compTel = 15443434

# 기본 테마
default.theme = blue

# 슈퍼관리자 설정
Super.CompId = super
Super.MainPgmId = PGM1221

# 권한 코드ID
Admin.AuthCodeId = 01
Super.AuthCodeGrpId = 018
Super.AuthCodeId = SUPER

# ---------- 오브젝트 스토리지 (AWS S3) ----------
# accessKey 가 비어 있으면 EC2 인스턴스 IAM Role → 서버에 키를 두지 않음
aws.s3.region=ap-northeast-2
aws.s3.bucket=ispark-ta-storage

# 에이전트 API URL
Globals.chatbot.apiIp = http://localhost:
Globals.chatbot.apiIpSearchOnly = http://localhost:9000/query_search_only

# 일반채팅 api url
Globals.chatbot.gpt.apiUrl = http://localhost:9000/query
Globals.chatbot.gpt.apiFileUrl = http://localhost:9000/file_query

# 컨텐츠관리 > 파일 저장 시 AI 다운로드 API URL
Globals.dataset.fileDownload.apiUrl = http://localhost:9111/pre_processing/download

# 데이터셋 구축 API URL
Globals.dataset.build.apiUrl = http://localhost:9111/pre_processing/run
# URL 스크래핑 SSE 스트림 API URL (추후 AI 서버에 올린 후 URL 수정 예정)
Globals.dataset.scraping.streamApiUrl = http://localhost:8002/scrape/stream
# 데이터셋 삭제 API URL
Globals.dataset.delete.apiUrl = http://localhost:9111/pre_processing/delete
# 데이터셋 테스트 API URL
Globals.dataset.test.apiUrl = http://localhost:9111/query_test
# 매뉴얼 질의(RAG) API URL — dataset_id 벡터 검색 + file_info 반환 (리서처 RAG에 사용)
Globals.chatbot.ragQuery.apiUrl = http://localhost:9111/query

# AI 보고서 요약/요약 생성
Globals.chatbot.summary.apiUrl = http://localhost:9000/summary_query
# AI 이미지생성
Globals.chatbot.image.apiUrl = http://localhost:9000/image_query

# 음성 전사 (gpt-4o-mini-transcribe) — OpenAI 직접 호출 (추후 수정 예정)
Globals.chatbot.transcribe.apiUrl = https://api.openai.com/v1/audio/transcriptions
Globals.chatbot.transcribe.model = gpt-4o-mini-transcribe
Globals.chatbot.transcribe.apiKey=OPEN_AI_API_KEY

# 전체 오디오 전사 (meeting_id 전달 → AI서버가 스토리지에서 직접 읽음)
Globals.chatbot.diarize.pythonUrl=http://61.78.123.204:9004/diarize

# 표준지역코드 API
Globals.region.api.baseUrl = https://apis.data.go.kr/1741000/StanReginCd/getStanReginCdList
Globals.region.api.decodeKey = DATA_GO_KR_DECODE_KEY
Globals.region.api.pageNo = 1
Globals.region.api.numOfRows = 1000
Globals.region.api.type = json
Globals.region.api.cacheTtlSec = 1800

# VWorld API
Globals.vworld.api.addressUrl = https://api.vworld.kr/req/address
Globals.vworld.api.key = VWORLD_API_KEY

# 점심메뉴 추천 모델 API
Globals.chatbot.lunch.apiUrl = http://localhost:9000/lunch_query

# 카카오 로컬 검색 API (점심 추천 장소 URL 생성)
Globals.kakao.local.keyword.apiUrl = https://dapi.kakao.com/v2/local/search/keyword.json
Globals.kakao.restApiKey = KAKAO_REST_API_KEY

# IMAP 메일 설정 (계정 정보는 UI 로그인 모달에서 입력 → 세션 사용)
Globals.mail.imap.host=mail.ispark.kr
Globals.mail.imap.port=993
